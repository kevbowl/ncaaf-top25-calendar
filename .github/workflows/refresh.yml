name: Refresh iCal

on:
  schedule:
    # During game times (USA Eastern Time) - run every hour
    - cron: '0 22-23 * * 4'   # Thursday 6pm-2am ET (22:00-23:59 UTC)
    - cron: '0 0-5 * * 5'     # Thursday 2am-6am ET (00:00-05:59 UTC)
    - cron: '0 22-23 * * 5'   # Friday 6pm-2am ET (22:00-23:59 UTC)
    - cron: '0 0-5 * * 6'     # Friday 2am-6am ET (00:00-05:59 UTC)
    - cron: '0 16-23 * * 6'   # Saturday 12pm-2am ET (16:00-23:59 UTC)
    - cron: '0 0-5 * * 0'     # Saturday 2am-6am ET (00:00-05:59 UTC)
    # Off-hours - run once daily at 3:00 PM ET (19:00 UTC)
    - cron: '0 19 * * 0'      # Sunday 3pm ET
    - cron: '0 19 * * 1'      # Monday 3pm ET
    - cron: '0 19 * * 2'      # Tuesday 3pm ET
    - cron: '0 19 * * 3'      # Wednesday 3pm ET
    # Keep the workflow enabled: GitHub disables scheduled jobs after 60 days with no repo activity.
    - cron: '0 12 1 * *'      # monthly keep-alive
  workflow_dispatch:
  push:
    paths:
      - '**/*.cs'
      - 'ncaaf-top25-calendar.csproj'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-ical
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Generate ICS
        run: dotnet run
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          date -u +%Y-%m-%dT%H:%M:%SZ > docs/last-refresh.txt

          ics_changed=0
          git diff --quiet HEAD -- docs/top25-ncaaf.ics docs/top25-ncaaf-h2h.ics || ics_changed=1

          if [ "$ics_changed" -eq 1 ]; then
            git add docs/top25-ncaaf.ics docs/top25-ncaaf-h2h.ics docs/last-refresh.txt
            git commit -m "chore: refresh ICS [skip ci]"
            git push
            exit 0
          fi

          # ICS unchanged: commit a keep-alive stamp at most every 21 days so GitHub
          # does not disable scheduled workflows after 60 days of inactivity.
          age_days=999
          if git cat-file -e HEAD:docs/last-refresh.txt 2>/dev/null; then
            last=$(git show HEAD:docs/last-refresh.txt | tr -d '\n')
            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            age_days=$(( (now_epoch - last_epoch) / 86400 ))
          fi
          if [ "$age_days" -lt 21 ]; then
            echo "ICS unchanged; keep-alive is ${age_days}d old — skipping commit"
            git checkout -- docs/last-refresh.txt 2>/dev/null || rm -f docs/last-refresh.txt
            exit 0
          fi
          git add docs/last-refresh.txt
          git commit -m "chore: keep-alive refresh stamp [skip ci]"
          git push


